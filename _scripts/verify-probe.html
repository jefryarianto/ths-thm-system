<!doctype html><html><head><meta charset="utf-8"><title>Verifikasi Publik Probe</title>
<style>body{margin:0;font-family:monospace;background:#111;color:#0f0;padding:16px}
iframe{width:100%;height:70vh;border:1px solid #333;background:#fff}
pre{white-space:pre-wrap}</style></head>
<body>
<pre id="status">memuat...</pre>
<iframe id="vf" src="https://ths-thm.cloud/verify/ea43c04c-adca-4451-92f8-32a997be0724"></iframe>
<script>
const status = document.getElementById('status');
const iframe = document.getElementById('vf');
iframe.onload = () => {
  status.textContent = 'iframe loaded OK (halaman verifikasi publik merespons). Coba akses DOM (mungkin diblokir cross-origin).';
};
// Probe API langsung dari sini (CORS akan menentukan)
fetch('https://ths-thm.cloud/api/documents/verify/ea43c04c-adca-4451-92f8-32a997be0724')
  .then(r => r.json())
  .then(d => { status.textContent = 'API OK: ' + JSON.stringify(d.data); })
  .catch(e => { status.textContent = 'API blocked by CORS di probe lokal: ' + e.message + ' — normal untuk halaman web biasa, app memakai cookie sesi. Halaman verify publik di browser host adalah sumber kebenaran.'; });
</script>
</body></html>
