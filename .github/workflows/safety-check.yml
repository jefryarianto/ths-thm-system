name: Safety Check

# Pemicu: hanya pull_request. Push (main/master/develop) sudah divalidasi
# CI/CD Pipeline (ci.yml) — workflow ini tidak mengulangnya per push.
#
# Sebelumnya workflow ini mengulang `pnpm install`, prisma generate,
# typecheck, lint, format:check, dan build yang semuanya sudah dijalankan
# ci.yml pada PR yang sama — plus `format:check` yang diketahui selalu
# gagal (utang format repo-wide ~712 file, lihat docs/CI_WORKFLOW_AUDIT.md
# R6). Yang tersisa di sini hanya guard yang TIDAK dimiliki ci.yml.
#
# Checklist deployment yang dulu di-echo job "deployment-gate" tetap
# hidup sebagai dokumen: docs/DEPLOYMENT_SAFETY.md.
on:
  pull_request:
    branches: [main, master, develop]

jobs:
  pre-merge:
    name: Pre-Merge Validation (guard .only/.skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Guard unik workflow ini (tanpa install — murni grep) ────────
      # `.only` membuat test lain ter-skip secara diam-diam → fatal.
      # `.skip` dicatat sebagai warning (non-fatal).
      - name: 📋 Check for test .only / .skip
        run: |
          echo "Checking for it.only / describe.only in test files..."
          FOUND_ONLY=$(grep -rn 'it\.only\|describe\.only' --include='*.spec.ts' --include='*.test.ts' . || true)
          if [ -n "$FOUND_ONLY" ]; then echo "$FOUND_ONLY"; echo "❌ Found .only in test files"; exit 1; fi
          echo "Checking for it.skip / describe.skip in test files..."
          FOUND_SKIP=$(grep -rn 'it\.skip\|describe\.skip' --include='*.spec.ts' --include='*.test.ts' . || true)
          if [ -n "$FOUND_SKIP" ]; then echo "$FOUND_SKIP"; echo "⚠️  Found .skip in test files (non-fatal)"; fi
