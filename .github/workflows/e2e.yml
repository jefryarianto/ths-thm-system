name: 🧪 E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ths_thm_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ths_thm_e2e
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build Next.js
        run: pnpm -F apps/web run build
      - name: Start Next.js server
        run: |
          cd apps/web
          nohup pnpm run start &
          SERVER_PID=$!
          sleep 10
          echo "Server started"
      - name: Run E2E tests
        run: pnpm -F apps/web run test:e2e
      - name: Stop server
        if: always()
        run: |
          kill $SERVER_PID || true
