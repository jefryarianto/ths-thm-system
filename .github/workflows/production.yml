name: 🚀 Production Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jefryarianto/ths-thm-system
  IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata (tags, labels)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}/api
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: Generate metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}/web
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS (ths-thm.cloud)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          envs: IMAGE_TAG
          script: |
            set -e

            echo "🚀 Deploying ths-thm.cloud (tag: ${IMAGE_TAG:-latest})..."

            cd /opt/ths-thm

            # Export image tag so docker-compose picks it up
            export IMAGE_TAG=${IMAGE_TAG:-latest}

            # Pull latest images (build happens in CI — zero CPU on VPS)
            echo "   Pulling images..."
            docker compose -f docker-compose.production.yml pull

            # Run database migrations before restarting (from apps/api/ so prisma finds schema.prisma)
            echo "   Running database migrations..."
            docker compose -f docker-compose.production.yml run --rm api \
              sh -c "cd apps/api && npx prisma migrate deploy" 2>&1 || echo "   ⚠️ Migration skipped"

            # Restart all services
            echo "   Restarting services..."
            docker compose -f docker-compose.production.yml up -d --remove-orphans

            # Wait for health check
            echo "   Waiting for API health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "   ✅ API is healthy!"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "   ❌ Health check FAILED. Container logs:"
                docker compose -f docker-compose.production.yml logs api --tail=30
                exit 1
              fi
              echo "   Attempt $i/30..."
              sleep 5
            done

            # Clean up unused images (save disk space on 40GB VPS)
            echo "   Cleaning up old images..."
            docker image prune -af --filter "until=24h" 2>/dev/null || true

            echo "✅ Deployment complete!"
            echo "   URL: https://ths-thm.cloud