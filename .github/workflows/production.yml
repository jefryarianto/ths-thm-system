name: 🚀 Production Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jefryarianto/ths-thm-system
  IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared-types
        run: pnpm --filter @ths-thm/shared-types build

      - name: Generate Prisma Client
        run: pnpm --filter @ths-thm/api prisma:generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Use default Buildx driver (avoids pulling moby/buildkit from Hub)
        shell: bash
        run: |
          docker buildx use default 2>/dev/null || docker buildx create --use

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata (tags, labels)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}/api
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: Generate metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}/web
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: TypeScript cache-busting check (tsc --noEmit)
        run: pnpm --filter @ths-thm/api tsc:check
        env:
          NODE_ENV: production

      - name: Build and push API image (with retry)
        shell: bash
        run: |
          retry() {
            local max_attempts=3 wait_seconds=15 attempt=1
            while [ $attempt -le $max_attempts ]; do
              if "$@"; then echo "   ✅ API image pushed"; return 0; fi
              echo "   ⚠️ Attempt $attempt/$max_attempts failed, retrying in ${wait_seconds}s..."
              sleep $wait_seconds
              attempt=$((attempt + 1))
            done
            echo "   ❌ API build failed after $max_attempts attempts"
            return 1
          }

          # Split multi-line metadata-action output into individual flags
          TAG_FLAGS=(); while IFS= read -r tag; do [ -n "$tag" ] && TAG_FLAGS+=(--tag "$tag"); done <<< "${{ steps.meta-api.outputs.tags }}"
          LABEL_FLAGS=(); while IFS= read -r label; do [ -n "$label" ] && LABEL_FLAGS+=(--label "$label"); done <<< "${{ steps.meta-api.outputs.labels }}"

          retry docker buildx build \
            "${TAG_FLAGS[@]}" \
            "${LABEL_FLAGS[@]}" \
            --file apps/api/Dockerfile \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .

      - name: Build and push Web image (with retry)
        shell: bash
        run: |
          retry() {
            local max_attempts=3 wait_seconds=15 attempt=1
            while [ $attempt -le $max_attempts ]; do
              if "$@"; then echo "   ✅ Web image pushed"; return 0; fi
              echo "   ⚠️ Attempt $attempt/$max_attempts failed, retrying in ${wait_seconds}s..."
              sleep $wait_seconds
              attempt=$((attempt + 1))
            done
            echo "   ❌ Web build failed after $max_attempts attempts"
            return 1
          }

          # Split multi-line metadata-action output into individual flags
          TAG_FLAGS=(); while IFS= read -r tag; do [ -n "$tag" ] && TAG_FLAGS+=(--tag "$tag"); done <<< "${{ steps.meta-web.outputs.tags }}"
          LABEL_FLAGS=(); while IFS= read -r label; do [ -n "$label" ] && LABEL_FLAGS+=(--label "$label"); done <<< "${{ steps.meta-web.outputs.labels }}"

          retry docker buildx build \
            "${TAG_FLAGS[@]}" \
            "${LABEL_FLAGS[@]}" \
            --file apps/web/Dockerfile \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .

  deploy:
    name: Deploy to VPS (ths-thm.cloud)
    needs: build-and-push
    runs-on: ubuntu-latest
    # Deploy script on the VPS (docker prune + pull + migrate + restart + health check)
    # can exceed 10 min on slow connections — give it headroom.
    timeout-minutes: 25

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          envs: IMAGE_TAG
          command_timeout: 30m
          script: |
            set -e

            echo "🚀 Deploying ths-thm.cloud (tag: ${IMAGE_TAG:-latest})..."

            cd /opt/ths-thm

            # Download latest config files from GitHub (VPS might have stale versions)
            # Write to .tmp first then mv — prevents partial file corruption on timeout
            curl -sf -o docker-compose.production.yml.tmp "https://raw.githubusercontent.com/jefryarianto/ths-thm-system/master/docker-compose.production.yml" && mv docker-compose.production.yml.tmp docker-compose.production.yml || { rm -f docker-compose.production.yml.tmp; echo "   ⚠️ Using existing compose file"; }
            curl -sf -o nginx/production.conf.tmp "https://raw.githubusercontent.com/jefryarianto/ths-thm-system/master/nginx/production.conf" && mv nginx/production.conf.tmp nginx/production.conf || { rm -f nginx/production.conf.tmp; echo "   ⚠️ Using existing nginx/production.conf"; }

            # Export image tag so docker-compose picks it up
            export IMAGE_TAG=${IMAGE_TAG:-latest}

            # Auto-cleanup Docker resources before pulling (prevents "no space left on device")
            # Aggressive: remove ALL unused images regardless of age. The old `--filter "until=24h"`
            # skipped freshly-pulled layers, letting the 40GB disk fill to 97%.
            echo "   Disk before cleanup:"
            df -h / | tail -1
            echo "   Cleaning up old Docker resources..."
            docker image prune -af 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            docker container prune -f 2>/dev/null || true
            echo "   Disk after cleanup:"
            df -h / | tail -1

            # Guard: fail fast if disk is still critically low (avoids confusing mid-pull failure)
            avail_kb=$(df -k / | tail -1 | awk '{print $4}')
            if [ -n "$avail_kb" ] && [ "$avail_kb" -lt 2097152 ]; then
              echo "   ❌ Disk space still below 2GB after cleanup — aborting deploy"
              exit 1
            fi

            # Pull latest images (build happens in CI — zero CPU on VPS)
            echo "   Pulling images..."
            docker compose -f docker-compose.production.yml pull --quiet 2>&1 | tail -5

            # Resolve any stuck migrations from previous failed deploys
            docker compose -f docker-compose.production.yml run --rm api \
              sh -c "npx prisma migrate resolve --rolled-back 20260820103000_cleanup_stale_notifications || true" 2>&1 || true
            # Run database migrations before restarting
            # Production image flattens API to /app/ — prisma/ is at /app/prisma/
            echo "   Running database migrations..."
            docker compose -f docker-compose.production.yml run --rm api \
              sh -c "npx prisma migrate deploy" 2>&1 || echo "   ⚠️ Migration skipped"

            # Stop & remove old containers, then restart with latest config
            echo "   Restarting Docker services..."
            docker compose -f docker-compose.production.yml down --remove-orphans 2>/dev/null || true
            docker compose -f docker-compose.production.yml up -d --remove-orphans

            # Wait for health check (via docker compose exec — api port is internal, not exposed on host)
            echo "   Waiting for API health check..."
            for i in $(seq 1 20); do
              if docker compose -f docker-compose.production.yml exec -T api wget --no-verbose --tries=1 --spider http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "   ✅ API is healthy!"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "   ❌ Health check FAILED. Container logs:"
                docker compose -f docker-compose.production.yml logs api --tail=30
                exit 1
              fi
              echo "   Attempt $i/20..."
              sleep 6
            done

            # Aggressive cleanup after deploy (save disk space on 40GB VPS)
            echo "   Pruning old Docker resources..."
            docker image prune -af 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            docker container prune -f 2>/dev/null || true
            echo "   Disk after deploy:"
            df -h / | tail -1

            echo "✅ Deployment complete!"
            echo "   URL: https://ths-thm.cloud"
