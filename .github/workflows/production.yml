name: 🚀 Production Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jefryarianto/ths-thm-system
  IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared-types
        run: pnpm --filter @ths-thm/shared-types build

      - name: Generate Prisma Client
        run: pnpm --filter @ths-thm/api prisma:generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Use default Buildx driver (avoids pulling moby/buildkit from Hub)
        shell: bash
        run: |
          docker buildx use default 2>/dev/null || docker buildx create --use

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata (tags, labels)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}/api
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: Generate metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}/web
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: TypeScript cache-busting check (tsc --noEmit)
        run: pnpm --filter @ths-thm/api tsc:check
        env:
          NODE_ENV: production

      - name: Build and push API image (with retry)
        shell: bash
        run: |
          retry() {
            local max_attempts=3 wait_seconds=15 attempt=1
            while [ $attempt -le $max_attempts ]; do
              if "$@"; then echo "   ✅ API image pushed"; return 0; fi
              echo "   ⚠️ Attempt $attempt/$max_attempts failed, retrying in ${wait_seconds}s..."
              sleep $wait_seconds
              attempt=$((attempt + 1))
            done
            echo "   ❌ API build failed after $max_attempts attempts"
            return 1
          }

          # Split multi-line metadata-action output into individual flags
          TAG_FLAGS=(); while IFS= read -r tag; do [ -n "$tag" ] && TAG_FLAGS+=(--tag "$tag"); done <<< "${{ steps.meta-api.outputs.tags }}"
          LABEL_FLAGS=(); while IFS= read -r label; do [ -n "$label" ] && LABEL_FLAGS+=(--label "$label"); done <<< "${{ steps.meta-api.outputs.labels }}"

          retry docker buildx build \
            "${TAG_FLAGS[@]}" \
            "${LABEL_FLAGS[@]}" \
            --file apps/api/Dockerfile \
            --push \
            .

      - name: Build and push Web image (with retry)
        shell: bash
        run: |
          retry() {
            local max_attempts=3 wait_seconds=15 attempt=1
            while [ $attempt -le $max_attempts ]; do
              if "$@"; then echo "   ✅ Web image pushed"; return 0; fi
              echo "   ⚠️ Attempt $attempt/$max_attempts failed, retrying in ${wait_seconds}s..."
              sleep $wait_seconds
              attempt=$((attempt + 1))
            done
            echo "   ❌ Web build failed after $max_attempts attempts"
            return 1
          }

          # Split multi-line metadata-action output into individual flags
          TAG_FLAGS=(); while IFS= read -r tag; do [ -n "$tag" ] && TAG_FLAGS+=(--tag "$tag"); done <<< "${{ steps.meta-web.outputs.tags }}"
          LABEL_FLAGS=(); while IFS= read -r label; do [ -n "$label" ] && LABEL_FLAGS+=(--label "$label"); done <<< "${{ steps.meta-web.outputs.labels }}"

          retry docker buildx build \
            "${TAG_FLAGS[@]}" \
            "${LABEL_FLAGS[@]}" \
            --file apps/web/Dockerfile \
            --push \
            .

  deploy:
    name: Deploy to VPS (ths-thm.cloud)
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Deploy script on the VPS (docker prune + pull + migrate + restart + health check)
    # can exceed 10 min on slow connections — give it headroom.
    timeout-minutes: 25

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT || '22' }} ${{ secrets.VPS_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check VPS SSH connectivity
        run: |
          HOST="${{ secrets.VPS_SSH_HOST }}"
          PORT="${{ secrets.VPS_SSH_PORT || '22' }}"
          USER="${{ secrets.VPS_SSH_USERNAME }}"
          if [ -z "$HOST" ]; then
            echo "   ❌ FAILURE: 'VPS_SSH_HOST' GitHub secret is empty."
            echo "   Set it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "   Pre-flight: SSH auth test to ${USER}@${HOST}:${PORT} ..."
          ok=0
          last_err=""
          for attempt in 1 2 3; do
            set +e
            out=$(ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" 'echo _OK_' 2>&1)
            rc=$?
            set -e
            if [ $rc -eq 0 ] && [ "$out" = "_OK_" ]; then ok=1; break; fi
            last_err="$out"
            echo "   ⚠️ Attempt ${attempt}/3: ${last_err} | retrying in 10s..."
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "   ❌ FAILURE: cannot SSH to ${USER}@${HOST}:${PORT}."
            echo "   ${last_err}"
            echo ""
            echo "   Most likely causes:"
            echo "   1. VPS is powered off / crashed — check your cloud provider dashboard (restart may be needed)."
            echo "   2. VPS IP changed — expected 202.10.34.209; run 'ping 202.10.34.209' from a reachable machine."
            echo "   3. Firewall/security-group blocking port ${PORT} — allow inbound SSH (UFW + cloud SG)."
            echo "   4. sshd not running — run 'sudo systemctl status ssh' on the VPS (via console/VNC)."
            echo "   5. 'Permission denied (publickey)' means wrong/expired 'VPS_SSH_PRIVATE_KEY' or user; verify it is in ~/.ssh/authorized_keys on the VPS."
            echo "   6. Stale 'VPS_SSH_HOST'/'VPS_SSH_PORT'/'VPS_SSH_USERNAME' secrets — verify in repo Settings > Secrets."
            exit 1
          fi
          echo "   ✅ SSH connected to ${USER}@${HOST}:${PORT} — ready to deploy."

      - name: Pass GHCR token to VPS and cleanup old images
        run: |
          # SSH hardening: faster fail on dead hosts, retry transient blips,
          # keep long-running commands alive.
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes)
          # Cleanup old images on VPS
          ssh "${SSH_OPTS[@]}" -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT || '22' }} \
            ${{ secrets.VPS_SSH_USERNAME }}@${{ secrets.VPS_SSH_HOST }} \
            'echo "   Disk before cleanup:" && df -h / | tail -1 && \
             docker image prune -af 2>/dev/null || true && \
             docker builder prune -af 2>/dev/null || true && \
             docker container prune -f 2>/dev/null || true && \
             echo "   Disk after cleanup:" && df -h / | tail -1'
          # Pipe GHCR token to VPS docker login (token never in command string).
          # PENTING: pakai github.token langsung — `gh auth token` tanpa env
          # GH_TOKEN selalu gagal di runner, sehingga login kosong dan pull
          # berikutnya selalu "error from registry: denied".
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh "${SSH_OPTS[@]}" -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT || '22' }} \
            ${{ secrets.VPS_SSH_USERNAME }}@${{ secrets.VPS_SSH_HOST }} \
            'cat | docker login ghcr.io -u ${{ github.actor }} --password-stdin'
          rm -f ~/.ssh/deploy_key

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          envs: IMAGE_TAG
          command_timeout: 30m
          script: |
            set -e

            echo "🚀 Deploying ths-thm.cloud (tag: ${IMAGE_TAG:-latest})..."

            cd /opt/ths-thm

            # Download latest config files from GitHub (VPS might have stale versions)
            # Write to .tmp first then mv — prevents partial file corruption on timeout
            curl -sf -o docker-compose.production.yml.tmp "https://raw.githubusercontent.com/jefryarianto/ths-thm-system/master/docker-compose.production.yml" && mv docker-compose.production.yml.tmp docker-compose.production.yml || { rm -f docker-compose.production.yml.tmp; echo "   ⚠️ Using existing compose file"; }
            curl -sf -o nginx/production.conf.tmp "https://raw.githubusercontent.com/jefryarianto/ths-thm-system/master/nginx/production.conf" && mv nginx/production.conf.tmp nginx/production.conf || { rm -f nginx/production.conf.tmp; echo "   ⚠️ Using existing nginx/production.conf"; }

            # Export image tag so docker-compose picks it up
            export IMAGE_TAG=${IMAGE_TAG:-latest}

            # Pull images from GHCR (authenticated via token from previous step).
            # FATAL sengaja: bila pull gagal, deploy berhenti di sini —
            # jangan lanjut migrasi/restart dengan image lama lalu gagal
            # samar di health check.
            echo "   Pulling Docker images from GHCR..."
            docker compose -f docker-compose.production.yml pull --quiet api web

            # Resolve any stuck migrations from previous failed deploys
            docker compose -f docker-compose.production.yml run --rm api \
              sh -c "npx prisma migrate resolve --rolled-back 20260820103000_cleanup_stale_notifications || true" 2>&1 || true
            # Run database migrations before restarting
            # Production image flattens API to /app/ — prisma/ is at /app/prisma/
            echo "   Running database migrations..."
            docker compose -f docker-compose.production.yml run --rm api \
              sh -c "npx prisma migrate deploy" 2>&1 || echo "   ⚠️ Migration skipped"
            # Seed kepengurusan data (only if table is empty)
            echo "   Seeding kepengurusan data..."
            docker compose -f docker-compose.production.yml run --rm api \
              sh -c "npx ts-node prisma/seed-kepengurusan.ts" 2>&1 || echo "   ⚠️ Seed skipped (data may already exist)"

            # Stop & remove old containers, then restart with latest config
            echo "   Restarting Docker services..."
            docker compose -f docker-compose.production.yml down --remove-orphans 2>/dev/null || true
            docker compose -f docker-compose.production.yml up -d --remove-orphans --force-recreate

            # Wait for health check (via docker compose exec — api port is internal, not exposed on host)
            echo "   Waiting for API health check..."
            for i in $(seq 1 20); do
              if docker compose -f docker-compose.production.yml exec -T api wget --no-verbose --tries=1 --spider http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "   ✅ API is healthy!"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "   ❌ Health check FAILED. Container logs:"
                docker compose -f docker-compose.production.yml logs api --tail=60
                exit 1
              fi
              echo "   Attempt $i/20..."
              sleep 6
            done

            # Aggressive cleanup after deploy (save disk space on 40GB VPS)
            echo "   Pruning old Docker resources..."
            docker image prune -af 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            docker container prune -f 2>/dev/null || true
            echo "   Disk after deploy:"
            df -h / | tail -1

            # ── Setup automated database backup (best-effort, non-blocking) ──
            # This section is wrapped in a subshell so sudo failures don't abort deploy.
            (
              echo "   Setting up automated database backup..."
              # Install backup scripts if not present
              if [ ! -f /opt/ths-thm/scripts/backup-database.sh ]; then
                curl -sf -o /tmp/backup-database.sh "https://raw.githubusercontent.com/jefryarianto/ths-thm-system/master/scripts/backup-database.sh" 2>/dev/null && \
                  mkdir -p /opt/ths-thm/scripts && \
                  mv /tmp/backup-database.sh /opt/ths-thm/scripts/backup-database.sh && \
                  chmod +x /opt/ths-thm/scripts/backup-database.sh || \
                  echo "   ⚠️ Failed to download backup script"
              fi
              # Install systemd timer (idempotent — only if not already active)
              # Uses sudo — may fail if deploy user lacks passwordless sudo.
              if ! systemctl is-active --quiet ths-thm-backup.timer 2>/dev/null; then
                curl -sf -o /tmp/ths-thm-backup.service "https://raw.githubusercontent.com/jefryarianto/ths-thm-system/master/scripts/systemd/ths-thm-backup.service" 2>/dev/null && \
                  curl -sf -o /tmp/ths-thm-backup.timer "https://raw.githubusercontent.com/jefryarianto/ths-thm-system/master/scripts/systemd/ths-thm-backup.timer" 2>/dev/null && \
                  sudo -n cp /tmp/ths-thm-backup.service /etc/systemd/system/ && \
                  sudo -n cp /tmp/ths-thm-backup.timer /etc/systemd/system/ && \
                  sudo -n systemctl daemon-reload && \
                  sudo -n systemctl enable ths-thm-backup.timer && \
                  sudo -n systemctl start ths-thm-backup.timer && \
                  echo "   ✅ Backup timer installed and started (daily at 02:00)" || \
                  echo "   ⚠️ Backup timer setup skipped (sudo unavailable — run manually on VPS)"
              else
                echo "   ✅ Backup timer already active"
              fi
              # Ensure backup directory exists
              mkdir -p /opt/backups/ths-thm/production 2>/dev/null || \
                sudo -n mkdir -p /opt/backups/ths-thm/production 2>/dev/null || true
              chown ths-thm:ths-thm /opt/backups/ths-thm/production 2>/dev/null || \
                sudo -n chown ths-thm:ths-thm /opt/backups/ths-thm/production 2>/dev/null || true
              # Run initial backup if directory is empty
              if [ ! -f /opt/backups/ths-thm/production/*.sql.gz ] 2>/dev/null; then
                echo "   Running initial database backup..."
                /opt/ths-thm/scripts/backup-database.sh 2>&1 | tail -5 || echo "   ⚠️ Initial backup skipped"
              fi
            ) || echo "   ⚠️ Backup setup skipped (non-critical)"

            echo "✅ Deployment complete!"
            echo "   URL: https://ths-thm.cloud"
            echo "   Backup: daily at 02:00 → /opt/backups/ths-thm/production/"
