# ── Security Scan ──────────────────────────────────────────────────────
# Scans codebase dependencies + secrets + filesystem for known vulns.
#   audit     — pnpm audit (dependency vulnerabilities)
#   trivy     — Trivy filesystem scan (SARIF → GitHub Security tab)
#   gitleaks  — secret scanning (CI full history)
#   Docker images — dipindai di workflow Production Deploy (job scan-images)
#                   dari GHCR langsung (R1, docs/CI_WORKFLOW_AUDIT.md), lalu
#                   dipindai ulang tiap Minggu (job scan-images-weekly) supaya
#                   CVE baru di image :latest tetap tertangkap.
# Snyk dihapus (R2) — tanpa SNYK_TOKEN hanya membayar install penuh.
#
# ── Secrets (optional) ────────────────────────────────────────────────
#   GITLEAKS_LICENSE  — Snyk/gitleaks license token (gitleaks-action v2)

name: 🔒 Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0' # weekly
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ─── 1. Dependency Audit (pnpm audit) ───────────────────────────────
  audit:
    name: 📦 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          AUDIT_JSON=$(pnpm audit --json 2>/dev/null)
          CRITICAL=$(echo "$AUDIT_JSON" | node -e "let data=JSON.parse(require('fs').readFileSync(0, 'utf-8')); let count = Object.values(data.advisories || {}).filter(a => a.severity === 'critical').length; console.log(count);" 2>/dev/null || echo "0")
          HIGH=$(echo "$AUDIT_JSON" | node -e "let data=JSON.parse(require('fs').readFileSync(0, 'utf-8')); let count = Object.values(data.advisories || {}).filter(a => a.severity === 'high').length; console.log(count);" 2>/dev/null || echo "0")
          MODERATE=$(echo "$AUDIT_JSON" | node -e "let data=JSON.parse(require('fs').readFileSync(0, 'utf-8')); let count = Object.values(data.advisories || {}).filter(a => a.severity === 'moderate').length; console.log(count);" 2>/dev/null || echo "0")
          LOW=$(echo "$AUDIT_JSON" | node -e "let data=JSON.parse(require('fs').readFileSync(0, 'utf-8')); let count = Object.values(data.advisories || {}).filter(a => a.severity === 'low').length; console.log(count);" 2>/dev/null || echo "0")
          
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "moderate=$MODERATE" >> "$GITHUB_OUTPUT"
          echo "low=$LOW" >> "$GITHUB_OUTPUT"
          
          echo "Dependency audit counts:"
          echo "  Critical: $CRITICAL"
          echo "  High:     $HIGH"
          echo "  Moderate: $MODERATE"
          echo "  Low:      $LOW"
          
          # Return status based on critical/high count
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Found $CRITICAL critical vulnerabilities!"
            exit 1
          fi
      - name: Audit summary
        shell: bash
        run: |
          echo "## 📦 Dependency Audit Result" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|:---------|------:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | ${{ steps.audit.outputs.critical || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | ${{ steps.audit.outputs.high || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Moderate | ${{ steps.audit.outputs.moderate || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚪ Low | ${{ steps.audit.outputs.low || '0' }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            echo "✅ **pnpm audit passed — no high-severity vulnerabilities found.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **pnpm audit found high-severity vulnerabilities that require attention.**" >> $GITHUB_STEP_SUMMARY
          fi

  # ─── 2. Trivy Filesystem Scan (SARIF) ──────────────────────────────
  # R1: Docker image tidak dibangun di sini — dipindai di Production Deploy.
  trivy:
    name: 🐳 Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — filesystem scan
        id: trivy-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem
      - name: Trivy summary
        if: always()
        shell: bash
        run: |
          echo "## 🐳 Trivy Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|:-----|:-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Filesystem | ${{ steps.trivy-fs.conclusion }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker (API/Web) | ℹ️ Dipindai di Production Deploy dari GHCR (R1) |" >> $GITHUB_STEP_SUMMARY

  # ─── 3. Secret Scanning (gitleaks) ─────────────────────────────────
  gitleaks:
    name: 🔐 Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        shell: bash
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan — git history + working tree
        id: gitleaks-scan
        continue-on-error: true
        shell: bash
        run: |
          if ! gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --report-format sarif --report-path gitleaks-git.sarif; then
            echo "gitleaks found findings (git history)"
          fi
          if ! gitleaks dir . --config .gitleaks.toml --redact --no-banner \
            --report-format sarif --report-path gitleaks-dir.sarif; then
            echo "gitleaks found findings (working tree)"
          fi
      - name: Upload gitleaks SARIF (history)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-git.sarif
          category: gitleaks-git-history
      - name: Upload gitleaks SARIF (working tree)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-dir.sarif
          category: gitleaks-working-tree
      - name: Enforce (fail on findings)
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gitleaks-scan.outcome }}" = "failure" ]; then
            echo "::error::gitleaks mendeteksi secret — rotasi kredensial & hapus dari history."
            exit 1
          fi
          echo "✅ Tidak ada secret terdeteksi."

  # ─── 4. Weekly Rescan Production Images (GHCR :latest) ───────────────
  # Sisa temuan R1 / aksi #3 (docs/CI_WORKFLOW_AUDIT.md): scan-images di
  # production.yml hanya jalan saat ada deploy. Image lama yang sudah di-push
  # bisa punya CVE baru di DB Trivy minggu depan — job ini memindai ulang
  # :latest tiap Minggu dan mengirim SARIF baru ke Security tab.
  scan-images-weekly:
    name: 🐳 Weekly Image Rescan (GHCR)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read # pull image GHCR
      security-events: write # upload SARIF ke Security tab

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull production images (latest)
        shell: bash
        run: |
          docker pull ghcr.io/jefryarianto/ths-thm-system/api:latest
          docker pull ghcr.io/jefryarianto/ths-thm-system/web:latest

      - name: Trivy — scan image API (latest CVE DB)
        id: trivy-api
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/jefryarianto/ths-thm-system/api:latest
          format: sarif
          output: trivy-api-weekly.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Trivy — scan image Web (latest CVE DB)
        id: trivy-web
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/jefryarianto/ths-thm-system/web:latest
          format: sarif
          output: trivy-web-weekly.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy SARIF (API)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api-weekly.sarif
          category: trivy-image-api-weekly

      - name: Upload Trivy SARIF (Web)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-web-weekly.sarif
          category: trivy-image-web-weekly

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## 🐳 Weekly Image Rescan (GHCR :latest)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Trivy status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|:------|:-------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| api:latest | ${{ steps.trivy-api.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| web:latest | ${{ steps.trivy-web.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Status \`success\` berarti tidak ada CRITICAL/HIGH pada CVE DB terbaru." >> "$GITHUB_STEP_SUMMARY"
