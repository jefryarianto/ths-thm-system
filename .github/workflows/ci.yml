name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ths_thm_test
          POSTGRES_USER: ths_thm
          POSTGRES_PASSWORD: ths_thm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ths_thm:ths_thm_password@localhost:5432/ths_thm_test
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ths-thm/api prisma:generate

      - name: Run database migrations
        run: pnpm --filter @ths-thm/api prisma:deploy
        env:
          DATABASE_URL: postgresql://ths_thm:ths_thm_password@localhost:5432/ths_thm_test

      - name: Sync schema (safety net for undocumented models)
        run: pnpm --filter @ths-thm/api exec prisma db push
        env:
          DATABASE_URL: postgresql://ths_thm:ths_thm_password@localhost:5432/ths_thm_test

      - name: TypeScript cache-busting check (tsc --noEmit)
        run: pnpm --filter @ths-thm/api tsc:check

      - name: Run TypeScript type check
        run: pnpm --filter @ths-thm/api typecheck

      - name: Run API Tests
        run: pnpm --filter @ths-thm/api test

      - name: Typecheck Web
        run: pnpm --filter @ths-thm/web typecheck

      - name: Typecheck Mobile
        run: pnpm --filter @ths-thm/mobile typecheck

      - name: Run Lint
        run: pnpm -r run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ths-thm/api prisma:generate

      - name: Build API
        run: pnpm --filter @ths-thm/api build

      - name: Build Web
        run: pnpm --filter @ths-thm/web build
