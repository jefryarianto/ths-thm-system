name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ths-thm/shared-types build
      - run: pnpm --filter @ths-thm/api prisma:generate
      - run: pnpm typecheck

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ths_thm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ths-thm/shared-types build
      - run: pnpm --filter @ths-thm/api prisma:generate
      - run: pnpm --filter @ths-thm/api prisma:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ths_thm_test
      - run: pnpm --filter @ths-thm/api test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ths_thm_test
          JWT_SECRET: ci-test-jwt-secret-key-min-32-chars-long-for-ci
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-key-min-32-chars-long

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ths-thm/web build