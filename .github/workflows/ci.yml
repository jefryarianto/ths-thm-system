name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ths-thm/shared-types build
      - run: pnpm --filter @ths-thm/api prisma:generate
      - run: pnpm typecheck

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ths_thm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ths-thm/shared-types build
      - run: pnpm --filter @ths-thm/api prisma:generate
      - run: pnpm --filter @ths-thm/api prisma:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ths_thm_test
      - run: pnpm --filter @ths-thm/api test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ths_thm_test
          JWT_SECRET: ci-test-jwt-secret-key-min-32-chars-long-for-ci
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-key-min-32-chars-long

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ths-thm/web build

  # ─── Repo Hygiene: whitelist dokumen root ─────────────────────────
  # Root hanya untuk README.md / CHANGELOG.md / CONTRIBUTING.md.
  # Panduan & dokumentasi lain wajib hidup di docs/ (aktif) atau
  # docs/archive/ (usang) — lihat CONTRIBUTING.md → Struktur Dokumentasi.
  repo-hygiene:
    name: 🧹 Repo Hygiene (root .md whitelist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check root markdown whitelist
        run: |
          ALLOWED="README.md CHANGELOG.md CONTRIBUTING.md"
          VIOLATIONS=""
          for f in *.md; do
            [ -e "$f" ] || continue
            ok=0
            for a in $ALLOWED; do
              [ "$f" = "$a" ] && ok=1 && break
            done
            [ $ok -eq 0 ] && VIOLATIONS="$VIOLATIONS $f"
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Dokumen .md tidak diizinkan di root:$VIOLATIONS"
            echo "Pindahkan ke docs/ (aktif) atau docs/archive/ (usang)."
            echo "Lihat bagian 'Struktur Dokumentasi' di CONTRIBUTING.md."
            exit 1
          fi
          echo "✅ Root markdown sesuai whitelist:$ALLOWED"

  # ─── E2E Web: suite Playwright (291 test non-visual) ─────────────────────────
  # Auth suite di-mock via e2e/helpers/auth.ts → tidak butuh API/DB nyata.
  # Server web dijalankan dari hasil `next build` (`next start`) sesuai
  # branch isCI di playwright.config.ts — produksi, tanpa cold-compile dev.
  # Test "Visual Regression" dikecualikan di CI: baseline screenshot
  # ber-suffix platform (win32) dan rendering font/AA lintas-OS tidak identik
  # — jalankan via `pnpm test:e2e:web` di lokal.
  e2e-web:
    name: 🎭 E2E Web (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40 # install+build ~4m, suite 2-worker di runner CI ~20m
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Install Playwright browser (chromium + OS deps)
        run: pnpm --filter @ths-thm/web exec playwright install --with-deps chromium
      - name: Build web (production)
        run: pnpm --filter @ths-thm/web build
        env:
          # Samakan dengan build di apps/web/Dockerfile (deploy produksi)
          NEXT_PUBLIC_ENABLE_REALTIME: 'true'
      - name: Run Playwright suite
        run: pnpm --filter @ths-thm/web test:e2e:web:ci
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/blob-report/
            apps/web/test-results/
          retention-days: 7