name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target environment (Docker images built from master branch only)'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jefryarianto/ths-thm-system

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ths_thm_test
          POSTGRES_USER: ths_thm
          POSTGRES_PASSWORD: ths_thm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ths_thm:ths_thm_password@localhost:5432/ths_thm_test
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ths-thm/api prisma:generate

      - name: Run database migrations
        run: pnpm --filter @ths-thm/api prisma:deploy
        env:
          DATABASE_URL: postgresql://ths_thm:ths_thm_password@localhost:5432/ths_thm_test

      - name: Run TypeScript type check
        run: pnpm --filter @ths-thm/api typecheck

      - name: Run API Tests
        run: pnpm --filter @ths-thm/api test

      - name: Run Lint
        run: pnpm -r run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ths-thm/api prisma:generate

      - name: Build API
        run: pnpm --filter @ths-thm/api build

      - name: Build Web
        run: pnpm --filter @ths-thm/web build

  build-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx (default driver — no Hub dependency)
        shell: bash
        run: |
          # Use default docker driver (does NOT pull moby/buildkit image)
          docker buildx use default 2>/dev/null || docker buildx create --use
          echo "Docker Buildx ready"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image (with retry)
        shell: bash
        run: |
          retry() {
            local max_attempts=3 wait_seconds=15 attempt=1
            while [ $attempt -le $max_attempts ]; do
              if "$@"; then echo "   ✅ API image pushed"; return 0; fi
              echo "   ⚠️ Attempt $attempt/$max_attempts failed, retrying in ${wait_seconds}s..."
              sleep $wait_seconds
              attempt=$((attempt + 1))
            done
            echo "   ❌ API build failed after $max_attempts attempts"
            return 1
          }
          retry docker buildx build \
            --file apps/api/Dockerfile \
            --tag ghcr.io/${{ env.IMAGE_NAME }}/api:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .

      - name: Build and push Web image (with retry)
        shell: bash
        run: |
          retry() {
            local max_attempts=3 wait_seconds=15 attempt=1
            while [ $attempt -le $max_attempts ]; do
              if "$@"; then echo "   ✅ Web image pushed"; return 0; fi
              echo "   ⚠️ Attempt $attempt/$max_attempts failed, retrying in ${wait_seconds}s..."
              sleep $wait_seconds
              attempt=$((attempt + 1))
            done
            echo "   ❌ Web build failed after $max_attempts attempts"
            return 1
          }
          retry docker buildx build \
            --file apps/web/Dockerfile \
            --tag ghcr.io/${{ env.IMAGE_NAME }}/web:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .

  deploy:
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.deploy_target }}" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to ${{ steps.env.outputs.target }} via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          envs: ENV_TARGET
          script: |
            set -e

            # Determine which env to deploy (from step output or default)
            ENV_TARGET="${{ steps.env.outputs.target }}"

            if [ "$ENV_TARGET" = "production" ]; then
              DIR="/opt/ths-thm"
              COMPOSE="docker-compose.production.yml"
              DOMAIN="ths-thm.cloud"
            else
              DIR="/opt/ths-thm-staging"
              COMPOSE="docker-compose.staging.yml"
              DOMAIN="staging.ths-thm.cloud"
            fi

            echo "🚀 Deploying to ${DOMAIN}..."
            cd "$DIR"

            # Download latest config files from GitHub (VPS might have stale versions)
            # Write to .tmp first then mv — prevents partial file corruption on timeout
            curl -sf -o "$COMPOSE.tmp" "https://raw.githubusercontent.com/jefryarianto/ths-thm-system/master/$COMPOSE" && mv "$COMPOSE.tmp" "$COMPOSE" || { rm -f "$COMPOSE.tmp"; echo "   ⚠️ Using existing compose file"; }

            # Download nginx config for this environment
            if [ "$ENV_TARGET" = "production" ]; then
              curl -sf -o nginx/production.conf.tmp "https://raw.githubusercontent.com/jefryarianto/ths-thm-system/master/nginx/production.conf" && mv nginx/production.conf.tmp nginx/production.conf || { rm -f nginx/production.conf.tmp; echo "   ⚠️ Using existing nginx/production.conf"; }
            else
              curl -sf -o nginx/staging.conf.tmp "https://raw.githubusercontent.com/jefryarianto/ths-thm-system/master/nginx/staging.conf" && mv nginx/staging.conf.tmp nginx/staging.conf || { rm -f nginx/staging.conf.tmp; echo "   ⚠️ Using existing nginx/staging.conf"; }
            fi

            # Pull images (built in CI — zero CPU on VPS)
            docker compose -f "$COMPOSE" pull

            # Run migrations (from apps/api/ so prisma finds schema.prisma)
            docker compose -f "$COMPOSE" run --rm api \
              sh -c "cd apps/api && npx prisma migrate deploy" 2>&1 || echo "   ⚠️ Migration skipped"

            # Restart services
            docker compose -f "$COMPOSE" up -d --remove-orphans

            # Health check (via docker compose exec — api port is internal, not exposed on host)
            for i in $(seq 1 30); do
              if docker compose -f "$COMPOSE" exec -T api wget --no-verbose --tries=1 --spider http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "   ✅ ${DOMAIN} API is healthy!"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "   ❌ ${DOMAIN} health check FAILED"
                docker compose -f "$COMPOSE" logs api --tail=20
                exit 1
              fi
              sleep 5
            done

            # Clean up old images (save disk on small VPS)
            docker image prune -af --filter "until=24h" 2>/dev/null || true
            echo "✅ ${DOMAIN} deploy complete!"
