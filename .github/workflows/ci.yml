name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ths_thm_test
          POSTGRES_USER: ths_thm
          POSTGRES_PASSWORD: ths_thm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ths_thm:ths_thm_password@localhost:5432/ths_thm_test
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ths-thm/api prisma:generate

      - name: Run database migrations
        run: pnpm --filter @ths-thm/api prisma:deploy
        env:
          DATABASE_URL: postgresql://ths_thm:ths_thm_password@localhost:5432/ths_thm_test

      - name: Run TypeScript type check
        run: pnpm --filter @ths-thm/api typecheck

      - name: Run API Tests
        run: pnpm --filter @ths-thm/api test

      - name: Run Lint
        run: pnpm -r run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ths-thm/api prisma:generate

      - name: Build API
        run: pnpm --filter @ths-thm/api build

      - name: Build Web
        run: pnpm --filter @ths-thm/web build

      - name: Debug Web Build Output
        run: |
          echo "=== apps/web directory ==="
          ls -la apps/web
          echo "=== apps/web/.next directory ==="
          ls -la apps/web/.next || echo ".next folder not found"

      - name: Upload API artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist/
          if-no-files-found: error

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/.next
          if-no-files-found: error
          include-hidden-files: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Download Web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Copy web build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "web-dist/"
          target: "/tmp/ths-thm-deploy/"
          strip_components: 1

      - name: Deploy to staging containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            # Deploy web build to staging container
            docker cp /tmp/ths-thm-deploy/.next/. ths-thm-staging-web:/app/.next/
            docker restart ths-thm-staging-web
            echo "✅ Web container restarted"

            # Run database migrations
            cd /opt/ths-thm-staging
            docker compose -f docker-compose.staging.yml exec -T api sh -c 'cd /app/apps/api && node_modules/.bin/prisma migrate deploy' 2>&1 || echo 'ℹ️ Migration skipped or already up to date'
            echo "✅ Database migrations applied"

            # Clean up temp files
            rm -rf /tmp/ths-thm-deploy
            echo "✅ Cleanup done"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Download API build artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api-dist

      - name: Download Web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Copy API build to VPS (production)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "api-dist/"
          target: "/tmp/ths-thm-prod-deploy/api-dist"

      - name: Copy Web build to VPS (production)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "web-dist/"
          target: "/tmp/ths-thm-prod-deploy/web-dist"

      - name: Deploy to production containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            # Deploy API build
            docker cp /tmp/ths-thm-prod-deploy/api-dist/. ths-thm-prod-api:/app/apps/api/dist/ 2>/dev/null || echo '⚠️ API container not running'
            # Deploy web build
            docker cp /tmp/ths-thm-prod-deploy/web-dist/. ths-thm-prod-web:/app/.next/ 2>/dev/null || echo '⚠️ Web container not running'
            # Restart containers
            docker restart ths-thm-prod-api 2>/dev/null || true
            docker restart ths-thm-prod-web 2>/dev/null || true
            echo "✅ Production containers restarted"
            # Run DB migrations
            docker exec ths-thm-prod-api sh -c 'cd /app/apps/api && node_modules/.bin/prisma migrate deploy' 2>&1 || echo 'ℹ️ Migration skipped'
            # Cleanup
            rm -rf /tmp/ths-thm-prod-deploy
            echo "✅ Production deploy complete"
