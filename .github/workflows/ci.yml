name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# Push beruntun ke branch yang sama: batalkan run yang ter-supersede —
# hanya hasil commit terakhir yang relevan untuk merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ths-thm/shared-types build
      - run: pnpm --filter @ths-thm/api prisma:generate
      - run: pnpm typecheck

  # ─── API Contract: swagger.json & api.d.ts harus sinkron ──────────
  # Regenerate kedua artefak lalu bandingkan dengan yang di-commit
  # (keduanya di-commit, bukan di-gitignore, agar bisa dibandingkan).
  # PR yang mengubah endpoint tanpa memperbarui kontrak akan gagal di sini.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ths-thm/shared-types build
      - run: pnpm --filter @ths-thm/api prisma:generate
      - name: Regenerate kontrak API
        env:
          # swagger:export mem-boot AppModule → env.validation (zod) butuh env
          # meski export tidak menyentuh DB/Redis. Dummy cukup: URL valid +
          # secret ≥32 karakter; refinement "production" tidak aktif karena
          # NODE_ENV tidak diset di CI.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy
          JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-0123456789abcdef0123456789abcdef
        run: |
          pnpm --filter @ths-thm/api swagger:export
          pnpm --filter @ths-thm/api generate:client
      - name: Verifikasi swagger.json & api.d.ts sinkron
        run: |
          git diff --exit-code -- apps/api/swagger.json apps/web/src/types/api.d.ts \
            || (echo "::error::Kontrak API basi — endpoint berubah tanpa regenerate. Jalankan 'pnpm --filter @ths-thm/api swagger:export && pnpm --filter @ths-thm/api generate:client' lalu commit hasilnya." && exit 1)
          echo "✅ Kontrak API sinkron"

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ths_thm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ths-thm/shared-types build
      - run: pnpm --filter @ths-thm/api prisma:generate
      - run: pnpm --filter @ths-thm/api prisma:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ths_thm_test
      - name: Test API (dengan coverage)
        run: pnpm --filter @ths-thm/api test:cov
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ths_thm_test
          JWT_SECRET: ci-test-jwt-secret-key-min-32-chars-long-for-ci
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-key-min-32-chars-long
      - name: Unggah laporan coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/lcov.info
          if-no-files-found: error

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ths-thm/web build

  # ─── Repo Hygiene: whitelist dokumen root ─────────────────────────
  # Root hanya untuk README.md / CHANGELOG.md / CONTRIBUTING.md.
  # Panduan & dokumentasi lain wajib hidup di docs/ (aktif) atau
  # docs/archive/ (usang) — lihat CONTRIBUTING.md → Struktur Dokumentasi.
  repo-hygiene:
    name: 🧹 Repo Hygiene (root .md whitelist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check root markdown whitelist
        run: |
          ALLOWED="README.md CHANGELOG.md CONTRIBUTING.md"
          VIOLATIONS=""
          for f in *.md; do
            [ -e "$f" ] || continue
            ok=0
            for a in $ALLOWED; do
              [ "$f" = "$a" ] && ok=1 && break
            done
            [ $ok -eq 0 ] && VIOLATIONS="$VIOLATIONS $f"
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Dokumen .md tidak diizinkan di root:$VIOLATIONS"
            echo "Pindahkan ke docs/ (aktif) atau docs/archive/ (usang)."
            echo "Lihat bagian 'Struktur Dokumentasi' di CONTRIBUTING.md."
            exit 1
          fi
          echo "✅ Root markdown sesuai whitelist:$ALLOWED"

  # ─── E2E Web ──────────────────────────────────────────────────────
  # Dikonsolidasikan ke .github/workflows/e2e.yml (4 shard Playwright +
  # blob report + Smoke Test + Slack). Job e2e-web lama di sini menjalankan
  # suite yang sama untuk kedua kalinya pada setiap push — lihat
  # docs/CONTRIBUTING bila perlu menambah pemicu E2E baru.
