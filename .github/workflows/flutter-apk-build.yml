name: 📦 Flutter APK Build & Release

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/flutter-apk-build.yml'
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_PATH: apps/mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses
      - name: Setup release keystore (if secret exists)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks
            cat > apps/mobile_flutter/android/key.properties <<EOF
storePassword=${{ secrets.KEY_STORE_PASSWORD }}
keyPassword=${{ secrets.KEY_PASSWORD }}
keyAlias=${{ secrets.KEY_ALIAS }}
storeFile=/tmp/upload-keystore.jks
EOF
          fi
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons -t apps/mobile_flutter/lib/main.dart
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: ${{ env.APK_PATH }}
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
