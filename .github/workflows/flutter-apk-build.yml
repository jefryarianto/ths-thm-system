name: 📦 Flutter APK Build & Release

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/flutter-apk-build.yml'
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_PATH: apps/mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Setup release keystore (if secret exists)
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$KEY_STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            # Decode base64 ke file .keystore (format PKCS12)
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/upload-keystore.keystore
            
            # Validasi apakah file berhasil di-decode dan tidak kosong
            if [ ! -s /tmp/upload-keystore.keystore ]; then
              echo "ERROR: Keystore file is empty or invalid base64"
              exit 1
            fi
            
            # Tulis key.properties dengan path absolut ke file .keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=/tmp/upload-keystore.keystore\n' \
              "$KEY_STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            
            echo "✅ Release keystore configured successfully"
          else
            echo "⚠️ WARNING: Release keystore secrets not configured. Building unsigned/debug APK."
          fi

      - name: Verify keystore config
        run: |
          if [ -f android/key.properties ]; then
            echo "✅ key.properties is present:"
            cat android/key.properties | sed 's/Password.*/****/g' # Sembunyikan password di log
          else
            echo "⚠️ key.properties absent (unsigned build)"
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub || true

      - name: Run Flutter tests
        run: flutter test || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up signing artifacts
        if: always()
        run: |
          rm -f /tmp/upload-keystore.keystore
          rm -f android/key.properties
          echo "🧹 Signing artifacts cleaned up"