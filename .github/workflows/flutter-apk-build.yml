name: 📦 Flutter APK Build & Release

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/flutter-apk-build.yml'
    tags: ['v*']
  workflow_dispatch:

# Batalkan build yang ter-supersede — hemat actions minutes.
concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Build APK + Publish Release
    runs-on: ubuntu-latest
    env:
      APK_PATH: apps/mobile_flutter/build/app/outputs/flutter-apk/app-release.apk

    steps:
      # ── Setup environment ────────────────────────────────────
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      # ── Signing (keystore dari GitHub Secret) ────────────────
      # Catatan: `secrets` TIDAK boleh dipakai dalam if: (expression)
      # GitHub Actions — hanya diizinkan di dalam run: script dan env:.
      # Maka cek ketersediaan secret dilakukan di level shell.
      # key.properties hanya dibuat bila secret ada — di mesin lokal
      # maupun CI tanpa secret, build.gradle.kts fallback ke debug.
      - name: Setup release keystore (skip bila secret belum ada)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks
          cat > apps/mobile_flutter/android/key.properties <<EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=/tmp/upload-keystore.jks
          EOF
          echo "Release keystore terkonfigurasi - APK akan ditandatangani"
          else
          echo "Secret keystore belum di-set - memakai debug signing"
          fi

      # ── Quality gates ────────────────────────────────────────
      - name: Flutter pub get
        run: cd apps/mobile_flutter && flutter pub get

      - name: Flutter analyze
        run: cd apps/mobile_flutter && flutter analyze

      - name: Flutter test
        run: cd apps/mobile_flutter && flutter test

      # ── Build release APK ────────────────────────────────────
      - name: Build APK
        run: |
          cd apps/mobile_flutter
          flutter build apk \
            --release \
            --dart-define=API_URL=https://ths-thm.cloud/api \
            --build-number=${{ github.run_number }}

      # ── Upload artifact ──────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── Publish GitHub Release ───────────────────────────────
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-build-${{ github.run_number }}
          name: "Flutter Build ${{ github.run_number }}"
          generate_release_notes: true
          files: ${{ env.APK_PATH }}

      # ── Cleanup sensitive files ──────────────────────────────
      - if: always()
        run: rm -f /tmp/upload-keystore.jks apps/mobile_flutter/android/key.properties
