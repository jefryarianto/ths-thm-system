name: Android APK Build

# Build APK release otomatis:
#   - setiap push ke master (+ bisa dijalankan manual) → upload artifact
#   - push tag v* (mis. v1.2.3) → build + verifikasi signature produksi +
#     buat GitHub Release berisi 5 APK dengan catatan rilis otomatis.
#
# SIGNING PRODUKSI (wajib utk tag rilis, disarankan utk push biasa):
#   Setup 4 repository secrets dulu supaya APK di-sign kunci produksi:
#     - THS_THM_KEYSTORE_BASE64  → isi file apps/mobile/android/ths-thm-release.keystore
#                                   dalam base64 (lokal: `base64 -w0 <keystore>`)
#     - THS_THM_STORE_PASSWORD   → storePassword (lihat keystore.properties lokal)
#     - THS_THM_KEY_ALIAS        → keyAlias (default: ths-thm)
#     - THS_THM_KEY_PASSWORD     → keyPassword
#   Tag rilis TANPA signature produksi akan GAGAL (guard fingerprint di bawah).

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # utk membuat GitHub Release (gh release create)

concurrency:
  # build tag rilis tidak boleh dibatalkan oleh push master yang bersamaan
  group: android-apk-build-${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'push' }}
  cancel-in-progress: true

env:
  # Fingerprint SHA-256 sertifikat kunci produksi (keystore ths-thm-release.keystore)
  PROD_CERT_SHA256: 4E92893C0DF8FD4DDF66D4267622150DD293947A592E45FDDCA17405FD4941A5

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 butuh Node >= 22.13
          node-version: 22
          cache: pnpm

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup release signing (jika secret tersedia)
        shell: bash
        run: |
          if [ -n "${{ secrets.THS_THM_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.THS_THM_KEYSTORE_BASE64 }}" | base64 -d > apps/mobile/android/ths-thm-release.keystore
            # pakai printf (bukan heredoc — indentasi YAML merusak terminator EOF)
            printf 'storeFile=ths-thm-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.THS_THM_STORE_PASSWORD }}" \
              "${{ secrets.THS_THM_KEY_ALIAS }}" \
              "${{ secrets.THS_THM_KEY_PASSWORD }}" \
              > apps/mobile/android/keystore.properties
            echo "✅ Keystore produksi disiapkan untuk signing release."
          else
            echo "⚠️  THS_THM_KEYSTORE_BASE64 tidak diset — APK memakai DEBUG key (tidak untuk publikasi)."
            echo "    Tambahkan secret repo: Settings → Secrets and variables → Actions."
          fi

      - name: Set versi dari tag (hanya tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"                  # mis. v1.2.3
          VER="${TAG#v}"
          echo "THS_THM_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          CODE=$(echo "$VER" | awk -F. '{printf "%d", ($1*10000)+($2*100)+$3}')
          echo "THS_THM_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Versi APK: $VER (versionCode $CODE)"

      - name: Build release APKs
        working-directory: apps/mobile/android
        env:
          # WAJIB: URL API yang di-bake ke bundle (tanpa ini APK menunjuk
          # http://localhost:3001 dan TIDAK bisa dipakai di HP sungguhan)
          EXPO_PUBLIC_API_URL: https://ths-thm.cloud
        run: |
          ./gradlew tasks --all | grep -i "assemble" || true
          ./gradlew assembleRelease --no-daemon --stacktrace --info
          echo "--- Build outputs ---"
          find app/build/outputs -type f 2>/dev/null || true

      - name: Verify APK signature
        shell: bash
        run: |
          BT_DIR="$ANDROID_HOME/build-tools"
          BT=$(ls "$BT_DIR" | sort -V | tail -1)
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          echo "build-tools: $BT"
          "$BT_DIR/$BT/apksigner" verify --print-certs "$APK" | head -4

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ths-thm-apk-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error

      - name: Create GitHub Release (hanya tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_DIR="apps/mobile/android/app/build/outputs/apk/release"
          BT_DIR="$ANDROID_HOME/build-tools"
          BT=$(ls "$BT_DIR" | sort -V | tail -1)

          # Guard: tag rilis WAJIB ter-sign kunci produksi
          DIGEST=$("$BT_DIR/$BT/apksigner" verify --print-certs "$APK_DIR/app-arm64-v8a-release.apk" \
            | grep -i "SHA-256 digest" | sed 's/.*: //' | tr '[:lower:]' '[:upper:]')
          if [ "$DIGEST" != "$PROD_CERT_SHA256" ]; then
            echo "::error::APK tidak ter-sign kunci produksi (SHA-256 $DIGEST)."
            echo "::error::Set THS_THM_KEYSTORE_BASE64 + password secrets sebelum membuat tag rilis."
            exit 1
          fi
          echo "✅ Signature produksi terverifikasi: $DIGEST"

          # Versi dari tag (v1.2.3 → "1.2.3")
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$APK_DIR"/*.apk \
            "$APK_DIR"/output-metadata.json \
            --generate-notes \
            --title "THS-THM $VER"
