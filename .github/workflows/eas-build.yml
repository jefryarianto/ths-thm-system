name: EAS Build (Android APK)

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  eas-build-android:
    name: Build APK with EAS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK with EAS (local)
        run: |
          cd apps/mobile
          npx eas build \
            --platform android \
            --profile production-apk \
            --local \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://ths-thm.cloud
          EXPO_NO_DOCTOR: 1
          CI: 1
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_OPTS: '-Xmx4096m -XX:MaxMetaspaceSize=1024m'
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2'

      - name: Extract APK from EAS build archive
        run: |
          cd apps/mobile
          # EAS --local build produces a tar.gz archive
          ARCHIVE=$(ls -t build-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "No EAS build archive found!"
            exit 1
          fi
          echo "Extracting APK from $ARCHIVE..."
          tar -xzf "$ARCHIVE"
          # Find all APK files
          echo "APK files found:"
          find . -name '*.apk' -type f 2>/dev/null
          # Copy universal APK to a known location for upload
          mkdir -p ./apk-output
          # Prefer universal, fallback to arm64, fallback to any
          if [ -f "./android/app/build/outputs/apk/release/app-universal-release.apk" ]; then
            cp ./android/app/build/outputs/apk/release/app-universal-release.apk ./apk-output/ths-thm-universal.apk
          elif [ -f "./android/app/build/outputs/apk/release/app-arm64-v8a-release.apk" ]; then
            cp ./android/app/build/outputs/apk/release/app-arm64-v8a-release.apk ./apk-output/ths-thm-arm64.apk
          else
            cp $(find . -name '*-release.apk' -type f | head -1) ./apk-output/ths-thm.apk
          fi
          echo "APK ready for upload:"
          ls -la ./apk-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/apk-output/*.apk
          retention-days: 30

      - name: Publish OTA Update (EAS Update)
        if: success()
        run: |
          cd apps/mobile
          npx eas update             --platform android             --channel production             --message "OTA update from CI build ${{ github.run_number }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://ths-thm.cloud
          EXPO_NO_DOCTOR: 1
          CI: 1
