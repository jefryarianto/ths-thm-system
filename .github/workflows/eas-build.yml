name: EAS Build (Android APK)

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  eas-build-android:
    name: Build APK with EAS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Expo CLI
        run: corepack enable && corepack prepare expo --activate

      - name: Login to Expo
        run: |
          echo "${{ secrets.EXPO_TOKEN }}" | npx expo login --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK with EAS (local)
        run: |
          cd apps/mobile
          npx eas build \
            --platform android \
            --profile production-apk \
            --local \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://ths-thm.cloud

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
