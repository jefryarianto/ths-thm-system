version: 2
updates:
  - package-ecosystem: pnpm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      typescript-ecosystem:
        patterns:
          - 'typescript'
          - '@types/*'
      nextjs-ecosystem:
        patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
