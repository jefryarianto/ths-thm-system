org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin (AGP 9) — semua plugin sudah migrasi; KGP tidak lagi dipakai.
android.builtInKotlin=true
# Kotlin incremental compiler gagal menutup cache incremental di Windows saat
# pub cache (C:) dan project (D:) berada di drive berbeda — Path.relativize
# melempar "different roots" (flutter/flutter#173456). Nonaktifkan kompilasi
# incremental agar build APK release di runner Windows tidak gagal.
kotlin.incremental=false
