# Staging environment for ths-thm.cloud
# Usage: docker compose -f docker-compose.staging.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: ths-thm-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ths_thm_staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-staging_password_change_me}
      POSTGRES_DB: ths_thm_staging
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ths_thm_staging -d ths_thm_staging']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ths-thm-staging
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: ths-thm-staging-redis
    restart: unless-stopped
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ths-thm-staging
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  api:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_REPO:-jefryarianto/ths-thm-system}/api:${IMAGE_TAG:-latest}
    container_name: ths-thm-staging-api
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      DATABASE_URL: postgresql://ths_thm_staging:${STAGING_DB_PASSWORD:-staging_password_change_me}@postgres:5432/ths_thm_staging
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${STAGING_JWT_SECRET}
      JWT_REFRESH_SECRET: ${STAGING_JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      APP_PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: https://staging.ths-thm.cloud
      CORS_ORIGINS: https://staging.ths-thm.cloud,http://localhost:3000
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_DOMAIN: ${RESEND_DOMAIN:-ths-thm.cloud}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ORG: ${SENTRY_ORG}
      SENTRY_PROJECT: ${SENTRY_PROJECT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ths-thm-staging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  web:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_REPO:-jefryarianto/ths-thm-system}/web:${IMAGE_TAG:-latest}
    container_name: ths-thm-staging-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://staging.ths-thm.cloud/api
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ORG: ${SENTRY_ORG}
      SENTRY_PROJECT: ${SENTRY_PROJECT}
    depends_on:
      - api
    networks:
      - ths-thm-staging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: ths-thm-staging-nginx
    restart: unless-stopped
    ports:
      - '8080:80'
      - '8443:443'
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      - ths-thm-staging
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  staging_postgres_data:
  staging_redis_data:

networks:
  ths-thm-staging:
    driver: bridge