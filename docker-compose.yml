services:
  postgres:
    image: postgres:16-alpine
    container_name: ths-thm-system-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ths_thm
      POSTGRES_PASSWORD: ths_thm_password
      POSTGRES_DB: ths_thm_db
    ports:
      - '54321:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ths_thm -d ths_thm_db']
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: ths-thm-system-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ths-thm-system-api
    restart: unless-stopped
    ports:
      - '4000:3001'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ths_thm:ths_thm_password@postgres:5432/ths_thm_db
      REDIS_URL: redis://redis:6379
      APP_PORT: 3001
      # CORS: allow frontend dev server
      CORS_ORIGINS: http://localhost:3000,http://localhost:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    command: node apps/api/dist/main.js
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ths-thm-system-web
    restart: on-failure
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      NODE_ENV: production
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:
  redis_data: