packages:
  - 'apps/*'
  - 'packages/*'

nodeLinker: hoisted

overrides:
  react: 18.2.0
  react-dom: 18.2.0
  '@types/react': 18.2.0
  axios: 1.19.0
  form-data: 4.0.6
  fast-uri: 3.1.5
  multer: 2.2.0
  uuid: 14.0.1
  # CVE-2026-12590: DoS saat limit invalid (body-parser < 1.20.6) — express@5 (bull-board) teruji OK dgn 1.20.6
  body-parser: 1.20.6
  # CVE-2026-31808 / CVE-2026-32630: file-type < 21.3.1 (dipakai @nestjs/common via dynamic import)
  file-type: 21.3.4
  # GHSA-5p4m-2wfm-xmqj (HIGH) + CVE-2025-64718 / CVE-2026-59869 / CVE-2026-53550
  js-yaml: 4.3.1
  # CVE-2026-4800 (CVSS 9.1) + CVE-2025-13465 + CVE-2026-2950
  lodash: 4.18.1
  # CVE-2026-8723: qs 6.11.1 s/d 6.15.1 (fix 6.15.2)
  qs: 6.15.2

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  dtrace-provider: true
  'msgpackr-extract': true
  'prisma': true
  'protobufjs': true
  'sharp': true
  'unrs-resolver': true
