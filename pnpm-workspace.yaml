packages:
  - 'apps/*'
  - 'packages/*'

nodeLinker: hoisted

# React TIDAK dioverride: tiap app pin versinya sendiri (web ^19 untuk Next 16,
# api "18" utk @react-pdf/renderer 3.x). Mobile kini Flutter (tidak memakai React).
# Override global React 18.2.0 membuat web Next 16 jalan di atas React 18 + @types 19.
overrides:
  axios: 1.20.0
  form-data: 4.0.6
  fast-uri: 3.1.9
  multer: 2.5.0
  uuid: 14.0.1
  # GHSA-27r3-jxmh-p828 (HIGH): body-parser DoS trailing bytes after compressed body — fix 1.20.9
  body-parser: 1.20.9
  # CVE-2026-31808 / CVE-2026-32630: file-type < 21.3.1 (dipakai @nestjs/common via dynamic import)
  file-type: 21.3.4
  # GHSA-5p4m-2wfm-xmqj (HIGH) + CVE-2025-64718 / CVE-2026-59869 / CVE-2026-53550
  js-yaml: 4.3.2
  # CVE-2026-4800 (CVSS 9.1) + CVE-2025-13465 + CVE-2026-2950
  lodash: 4.18.1
  # GHSA-6pq8-jhm2-2vcw / CVE-2026-110816 qs stringify comma DoS — fix 6.16.1 (sebelumnya 6.16.0)
  qs: 6.16.1

  # ── Dependabot P0: socket.io stack (parser HIGH, engine.io HIGH, ws HIGH) ──
  socket.io-parser: 4.2.7
  engine.io: 6.6.11
  ws: 8.22.0

  # ── Dependabot P1: transitive firebase-admin (websocket-driver CRITICAL) ──
  websocket-driver: 0.7.5
  '@fastify/busboy': 3.2.2
  '@grpc/grpc-js': 1.14.5
  protobufjs: 7.6.5

  # ── undici: 21 alert (jalur jsdom/vitest) — fix 7.30.1 (cache-poisoning, TLS bypass, DoS) ──
  undici: 7.30.1

  # ── Dependabot: pin range tak mengizinkan fix ──
  # shell-quote di-pin concurrently exact 1.8.3 (CRITICAL/HIGH)
  shell-quote: 1.12.0
  # tmp ^0.0.33 (external-editor) — fix hanya di 0.2.4+, API tmpNameSync kompatibel
  tmp: 0.2.7

  # ── Dependabot batch: 27 alert fixable (1 critical + 13 high sisanya) ──
  # proxy-addr CRITICAL (GHSA-jqcg-44mw-7w3h, ReDoS) — jalur express compression
  proxy-addr: 2.0.8
  # compression HIGH (GHSA-vc2v-76pw-4v95, DoS chunked) — direct dep apps/api
  # compression@<1.8.2; version di apps/api/package.json sudah ^1.8.2
  # brace-expansion: 3 GHSA × beberapa major line (semua ReDoS)
  brace-expansion@>=4.0.0: 5.0.12
  brace-expansion@>=3.0.0 <4.0.0: 5.0.6
  brace-expansion@>=2.0.0 <3.0.0: 2.1.7
  brace-expansion@>=1.0.0 <2.0.0: 1.1.21
  # picomatch HIGH+MED (GHSA-c2c7-rcm5-vvqj / GHSA-3v7f-55p6-f55p, ReDoS)
  picomatch: 4.0.7
  # glob MED GHSA-3g3m-2fjr-6pw4 (AbortSignal cancellation bypass) — vulnerable >=9 <=14.0.1,
  # fix hanya di 14.0.2. glob 7.2.3 (jest 29/test-exclude) di BAWAH range → tetap aman tanpa
  # di-override; hanya baris >=9 (kini @nestjs/cli glob 13) yang didorong ke 14.0.2.
  # Override lama glob@>=10.2.0 <10.5.0 dihapus: baris 10.x sudah tak ada di lockfile.
  'glob@>=9.0.0': 14.0.2
  # minimatch MED GHSA-g3hv-75wg-m249 (globparts amplification) — TIDAK di-override ke 11.0.1:
  # fix hanya ada di 11.0.1 (tanpa backport), tapi glob7 (jest29/eslint8) menembak internal
  # Minimatch v3 (part RegExp + `_glob`) yang sudah tak ada di v11 → eslint gagal ekspansi
  # pola. Perbaikan menuntut migrasi toolchain (eslint9 flat config + jest30) — alert #168
  # di-dismiss sebagai fix_incomplete.
  # browserslist HIGH ×2 (GHSA-73wf-gq98-2v4g / GHSA-c83g-rgw3-j3cx, ReDoS)
  browserslist: 4.29.3
  # webpack HIGH+LOW (GHSA-8/×2, ReDoS di chunk-parser)
  # webpack HIGH+LOW (GHSA-8/×2, ReDoS di chunk-parser) — 5.104.0 MASIH rentan, pakai 5.111.1
  webpack: 5.111.1
  # ajv MED (GHSA-2g4f-4pwh-qvx6, prototype pollution <8.18.0)
  'ajv@>=7.0.0 <8.18.0': 8.18.0
  # source-map-js HIGH (GHSA-68fv-2mgg-jv7q, ReDoS <1.2.2) — jalur webpack/browserslist
  source-map-js: 1.2.2
  # postcss-selector-parser MED+LOW (GHSA-rj75-hqrm-r3gf / GHSA-w9m9-85wc-3x92)
  'postcss-selector-parser@>=6.0.0 <7.0.0': 6.1.3
  postcss-selector-parser: 7.1.6
  # baseline-browser-mapping MED (GHSA-w5vr-8v7q-w6rv, babel traverse) — jalur browserslist
  baseline-browser-mapping: 2.11.0
  # vitest + @vitest/mocker MED (GHSA-82fw-gwwq-j7x9 <4.1.11) — direct dep apps/web
  # vitest@^4.1.12 di apps/web/package.json; mocker transitive mengikuti
  '@vitest/mocker': 4.1.12
  # @vitest/mocker MED GHSA-qxg6-89mg-rqv8 (code injection manual mock) & GHSA-xp26-3454-mjgp
  # (backslash traversal bypass allowlist) — keduanya fix di 4.1.12

  # ── Dependabot 2026-10-22: rantai vite/vitest (apps/web) ──
  # vite 8.0.16 -> 8.1.6: HIGH GHSA-587h-7wmj-h5pm (launch-editor fs.existsSync bypass, Windows),
  # MED GHSA-r825-w8mm-5pxw / GHSA-698v-4r3x-3vcv / GHSA-v6wh-96g9-6wx3, LOW GHSA-9jrq-w75r-8gcw
  vite: 8.1.6

  # follow-redirects HIGH GHSA-mrwp-f3q8-3g9p (cross-realm sensitiveHeaders + credentials
  # redirect) — fix 1.16.2 (sebelumnya 1.16.1)
  follow-redirects: 1.16.2
  # Handlebar advisory patched; published package versions for other advisories are still vulnerable.
  handlebars: 4.7.10

allowBuilds:
  # postinstall @firebase/util hanya berguna di Firebase App Hosting (butuh FIREBASE_WEBAPP_CONFIG)
  '@firebase/util': false
  '@scarf/scarf': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  dtrace-provider: true
  'msgpackr-extract': true
  'prisma': true
  'protobufjs': true
  'sharp': true
  'unrs-resolver': true

minimumReleaseAgeExclude:
  - shell-quote@1.12.0
