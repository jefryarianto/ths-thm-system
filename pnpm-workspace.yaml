packages:
  - 'apps/*'
  - 'packages/*'

nodeLinker: hoisted

# React TIDAK dioverride: tiap app pin versinya sendiri (web ^19 untuk Next 16,
# api "18" utk @react-pdf/renderer 3.x). Mobile kini Flutter (tidak memakai React).
# Override global React 18.2.0 membuat web Next 16 jalan di atas React 18 + @types 19.
overrides:
  axios: 1.20.0
  form-data: 4.0.6
  fast-uri: 3.1.8
  multer: 2.4.0
  uuid: 14.0.1
  # CVE-2026-12590: DoS saat limit invalid (body-parser < 1.20.6) — express@5 (bull-board) teruji OK dgn 1.20.6
  body-parser: 1.20.6
  # CVE-2026-31808 / CVE-2026-32630: file-type < 21.3.1 (dipakai @nestjs/common via dynamic import)
  file-type: 21.3.4
  # GHSA-5p4m-2wfm-xmqj (HIGH) + CVE-2025-64718 / CVE-2026-59869 / CVE-2026-53550
  js-yaml: 4.3.2
  # CVE-2026-4800 (CVSS 9.1) + CVE-2025-13465 + CVE-2026-2950
  lodash: 4.18.1
  # CVE-2026-8723 + advisory qs 6.14.2-6.15.3 (fix 6.16.0)
  qs: 6.16.0

  # ── Dependabot P0: socket.io stack (parser HIGH, engine.io HIGH, ws HIGH) ──
  socket.io-parser: 4.2.7
  engine.io: 6.6.11
  ws: 8.22.0

  # ── Dependabot P1: transitive firebase-admin (websocket-driver CRITICAL) ──
  websocket-driver: 0.7.5
  '@fastify/busboy': 3.2.2
  '@grpc/grpc-js': 1.14.5
  protobufjs: 7.6.5

  # ── undici: 21 alert (jalur jsdom/vitest) — fix 7.29.1 ──
  undici: 7.29.1

  # ── Dependabot: pin range tak mengizinkan fix ──
  # shell-quote di-pin concurrently exact 1.8.3 (CRITICAL/HIGH)
  shell-quote: 1.12.0
  # tmp ^0.0.33 (external-editor) — fix hanya di 0.2.4+, API tmpNameSync kompatibel
  tmp: 0.2.7

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  dtrace-provider: true
  'msgpackr-extract': true
  'prisma': true
  'protobufjs': true
  'sharp': true
  'unrs-resolver': true

minimumReleaseAgeExclude:
  - shell-quote@1.12.0
