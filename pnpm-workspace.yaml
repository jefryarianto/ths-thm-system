packages:
  - 'apps/*'
  - 'packages/*'

nodeLinker: hoisted

overrides:
  react: 18.2.0
  react-dom: 18.2.0
  '@types/react': 18.2.0
  axios: 1.19.0
  form-data: 4.0.6
  fast-uri: 3.1.5
  multer: 2.2.0
  uuid: 14.0.1

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  'msgpackr-extract': true
  'prisma': true
  'protobufjs': true
  'sharp': true
  'unrs-resolver': true
